
name: Telegram Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-image-test:
    if: ${{ github.ref == 'refs/heads/feature/telegram-dashboard-v1' }}
    runs-on: ubuntu-26.04
    environment: STOCK_LIST
    timeout-minutes: 15

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import markdown2, imgkit, requests; print('Python dependencies OK')"

      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install image rendering dependencies
        run: |
          echo "Checking operating system..."
          cat /etc/os-release

          echo "Checking Node.js environment..."
          node --version
          npm --version

          echo "Installing Playwright..."
          npm install -g playwright@1.65.1

          echo "Installing Chromium and system dependencies..."
          playwright install --with-deps chromium

          echo "Installing Chinese fonts..."
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fontconfig
          fc-cache -f

          echo "Checking Playwright CLI..."
          command -v playwright
          playwright --version

          echo "Checking Chinese fonts..."
          fc-match "Noto Sans CJK SC"

          echo "Playwright rendering dependencies installed successfully."


      - name: Run offline dashboard contract tests
        run: |
          python -m compileall -q main.py src/financial_dashboard.py src/core/pipeline.py src/notification.py
          python -m unittest discover -s tests -p test_financial_dashboard.py -v

      - name: Run Phase 2.1 financial data model tests
        run: |
          python -m compileall -q src/financial_data_model.py src/financial_data_adapters.py
          python -m unittest discover -s tests -p test_financial_data_model.py -v

      - name: Run Phase 2.2 raw archive tests
        run: |
          python -m compileall -q src/raw_data_archive.py src/core/market_review.py
          python -m unittest discover -s tests -p test_raw_data_archive.py -v
          python - <<'PY'
          from pathlib import Path
          from src.raw_data_archive import archive_inputs, archive_research, archive_market, write_index
          root = Path("image-test/raw_data_fixture")
          archive_inputs(root, code="002938", name="鹏鼎控股", market="cn", query_id="offline-fixture",
              rows=[dict(code="002938", date="2026-11-26", open=47, high=47.41, low=45.2,
                         close=45.8, volume=28849300, amount=1326000000, data_source="fixture")])
          archive_research(root, code="002938", query_id="offline-fixture",
                           result={"success":True,"model_used":"fixture","sentiment_score":58})
          archive_market(root, region="cn", query_id="offline-fixture",
                         payload={"region":"cn","markdown_report":"offline fixture"}, reused=True)
          assert write_index(root) == 3
          PY

      - name: Run Phase 2.4.3 offline routing and adjustment tests
        run: |
          mkdir -p image-test/phase243
          python -m compileall -q src/intelligent_fallback.py data_provider/base.py data_provider/tencent_fetcher.py data_provider/akshare_fetcher.py data_provider/baostock_fetcher.py data_provider/pytdx_fetcher.py data_provider/realtime_types.py src/storage.py src/core/pipeline.py src/raw_data_archive.py
          set -o pipefail
          python -m unittest discover -s tests -p test_intelligent_fallback.py -v 2>&1 | tee image-test/phase243/test-results.txt
          python -m pip install pytest
          python -m pytest -q tests/test_tencent_fetcher.py tests/test_pytdx_fetcher.py 2>&1 | tee image-test/phase243/provider-regression.txt

      - name: Run Phase 2.4.2 offline health monitor tests
        run: |
          python -m compileall -q src/provider_health_monitor.py src/services/run_diagnostics.py data_provider/base.py
          python -m unittest discover -s tests -p test_provider_health_monitor.py -v
          PYTHONPATH=tests:. python -c "from test_provider_health_monitor import render_fixture; render_fixture('image-test/phase242')"

      - name: Run Phase 2.4.1 offline source audit
        run: |
          python -m unittest discover -s tests -p test_data_source_audit.py -v
          python -m src.data_source_audit --output image-test/phase241 --tushare-points 120

      - name: Run Phase 2.3 quality manager tests
        run: |
          python -m compileall -q src/data_quality_manager.py src/financial_dashboard.py src/core/pipeline.py
          python -m unittest discover -s tests -p test_data_quality_manager.py -v

      - name: Render four independent Phase 2.3 scenarios
        run: |
          PYTHONPATH=tests:. python -c "from test_data_quality_manager import render_scenarios; print(render_scenarios('image-test/phase23'))"

      - name: Render fixed-sample financial dashboards
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests")
          from test_financial_dashboard import sample, MARKET, STOCK, CODES
          from src import financial_dashboard as fd
          notifier, rows, results = sample()
          output = Path("image-test")
          fd.save_status(rows, output)
          pages = fd.stock_pages(notifier, rows, results, STOCK)
          pages += fd.market_pages(MARKET)
          failed = fd.batch_status(CODES, [], dict.fromkeys(CODES, "TIMEOUT"))
          pages += [("all-failed-"+name, doc) for name, doc in fd.stock_pages(notifier, failed, [], "")]
          paths = fd.render_pages(pages, output)
          assert len(paths) == len(pages) and len(paths) >= 7, paths
          import json
          (output/'page-manifest.json').write_text(json.dumps([p.name for p in paths]), encoding='utf-8')
          (output/"market-fixture.md").write_text(MARKET, encoding="utf-8")
          (output/"stock-fixture.md").write_text(STOCK, encoding="utf-8")
          print("HD rendering PASS:", len(paths), "pages")
          PY

      - name: Send HD test files to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from types import SimpleNamespace
          from src import financial_dashboard as fd
          config = dict(bot_token=os.environ.get("TELEGRAM_BOT_TOKEN", ""),
                        chat_id=os.environ.get("TELEGRAM_CHAT_ID", ""),
                        message_thread_id=os.environ.get("TELEGRAM_MESSAGE_THREAD_ID", ""))
          notifier = SimpleNamespace(_telegram_config=config, _is_telegram_configured=lambda:bool(config["bot_token"] and config["chat_id"]))
          paths = sorted(Path("image-test").glob("*.png"))
          import json
          expected=json.loads(Path('image-test/page-manifest.json').read_text())
          assert sorted(p.name for p in paths)==sorted(expected)
          for p in paths:
              assert fd.send_file(notifier,p.name,p.read_bytes(),caption="V0.2.1 固定样本 / 非实时行情"), p.name
              time.sleep(1.2)
          p=Path("image-test/watchlist-01.png")
          assert fd.send_file(notifier,p.name,p.read_bytes(),photo=True,caption="V0.2.1 自选股预览 / 固定样本")
          # Send only the scenario watchlists and health overviews; full PNG sets stay in artifact.
          for folder in sorted(Path("image-test/phase23").glob("*/")):
              for name in ("watchlist-01.png","quality-overview.png"):
                  p=folder/name
                  assert fd.send_file(notifier,folder.name+"-"+p.name,p.read_bytes(),caption="固定样本 / 非实时行情 / "+folder.name), p.name
                  time.sleep(1.2)
          print("Telegram HD document and preview delivery PASS")
          PY

      - name: Upload image test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: financial-dashboard-test-${{ github.run_number }}
          path: image-test/
          if-no-files-found: warn
          retention-days: 7
